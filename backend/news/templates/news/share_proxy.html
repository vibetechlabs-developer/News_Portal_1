<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary Meta Tags -->
    <title>{{ title }}</title>
    <meta name="title" content="{{ title }}">
    <meta name="description" content="{{ summary }}">

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="article">
    <meta property="og:url" content="{{ target_url }}">
    <meta property="og:title" content="{{ title }}">
    <meta property="og:description" content="{{ summary }}">
    {% if image_url %}<meta property="og:image" content="{{ image_url }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">{% endif %}
    <meta property="og:site_name" content="Kanam Express">
    <meta property="og:locale" content="gu_IN">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="{{ target_url }}">
    <meta name="twitter:title" content="{{ title }}">
    <meta name="twitter:description" content="{{ summary }}">
    {% if image_url %}<meta name="twitter:image" content="{{ image_url }}">{% endif %}
    <meta name="twitter:site" content="@kanamexpress">

    <!-- Redirect humans to the actual article page (delay=1s so crawlers read OG tags above first) -->
    <meta http-equiv="refresh" content="1; url={{ target_url }}">
    <script>setTimeout(function(){ window.location.replace("{{ target_url|escapejs }}"); }, 500);</script>
</head>
<body style="font-family:sans-serif;text-align:center;padding:40px;background:#f5f5f5;">
    {% if image_url %}
    <img src="{{ image_url }}" alt="{{ title }}" style="max-width:400px;border-radius:8px;margin-bottom:16px;">
    {% endif %}
    <h1 style="font-size:1.2rem;color:#333;">{{ title }}</h1>
    <p style="color:#666;">{{ summary }}</p>
    <p><a href="{{ target_url }}" style="color:#c0392b;font-weight:bold;">સમાચાર વાંચો / Read Article</a></p>
</body>
</html>
